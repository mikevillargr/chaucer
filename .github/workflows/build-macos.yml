name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test
        working-directory: src-tauri

      # Unsigned universal build. hdiutil on hosted runners sometimes fails with
      # "Resource busy" while creating the dmg, so retry the bundling step.
      - name: Build app and dmg
        run: |
          for attempt in 1 2 3; do
            npm run tauri build -- --target universal-apple-darwin && exit 0
            echo "Build attempt $attempt failed; retrying in 15s"
            hdiutil info | grep -E "^/dev/disk" | awk "{print \$1}" | xargs -n1 hdiutil detach -force 2>/dev/null || true
            sleep 15
          done
          exit 1

      - name: Draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --draft --title "Chaucer ${{ github.ref_name }}" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Chaucer-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
