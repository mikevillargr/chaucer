name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A release tag must match the app version, or installed copies would be offered an
      # "update" that reports the old version and loop forever.
      - name: Check tag matches app version (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p 'require("./package.json").version')
          conf=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$conf" ] && [ "$tag" = "$cargo" ] || { echo "Version mismatch" >&2; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test
        working-directory: src-tauri

      # Unsigned universal build. hdiutil on hosted runners sometimes fails with
      # "Resource busy" while creating the dmg, so retry the bundling step.
      # Updater artifacts (Chaucer.app.tar.gz + .sig) are signed with the key in the
      # TAURI_SIGNING_PRIVATE_KEY secrets. Without the key, ordinary builds skip them,
      # but release tags fail so a release never ships without in-app updates.
      - name: Build app and dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=""
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "TAURI_SIGNING_PRIVATE_KEY secret is missing: release builds must be signed for updates" >&2
              exit 1
            fi
            echo "No updater signing key; building without update artifacts"
            extra='--config {"bundle":{"createUpdaterArtifacts":false}}'
          fi
          for attempt in 1 2 3; do
            npm run tauri build -- --target universal-apple-darwin $extra && exit 0
            echo "Build attempt $attempt failed; retrying in 15s"
            hdiutil info | grep -E "^/dev/disk" | awk "{print \$1}" | xargs -n1 hdiutil detach -force 2>/dev/null || true
            sleep 15
          done
          exit 1

      # Tag pushes (vX.Y.Z) create a draft release whose notes are that version's
      # CHANGELOG.md section; a missing section fails the build (see docs/RELEASING.md).
      - name: Draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            on && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          # In-app update feed: the app reads releases/latest/download/latest.json.
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          archive="Chaucer_${version}_universal.app.tar.gz"
          cp "$bundle/macos/Chaucer.app.tar.gz" "$archive"
          cp "$bundle/macos/Chaucer.app.tar.gz.sig" "$archive.sig"
          VERSION="$version" ARCHIVE="$archive" node -e '
            const fs = require("fs");
            const url = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GITHUB_REF_NAME}/${process.env.ARCHIVE}`;
            const signature = fs.readFileSync(process.env.ARCHIVE + ".sig", "utf8").trim();
            const platform = { signature, url };
            fs.writeFileSync("latest.json", JSON.stringify({
              version: process.env.VERSION,
              notes: fs.readFileSync("release-notes.md", "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms: { "darwin-aarch64": platform, "darwin-x86_64": platform },
            }, null, 2));
          '
          gh release create "$GITHUB_REF_NAME" --draft --title "Chaucer $GITHUB_REF_NAME" \
            --notes-file release-notes.md "$bundle"/dmg/*.dmg "$archive" "$archive.sig" latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: Chaucer-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
