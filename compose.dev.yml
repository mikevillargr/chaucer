name: chaucer

services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: chaucer-dev
    container_name: chaucer-dev
    user: "1000:1000"
    working_dir: /app
    volumes:
      - .:/app
      - dev-cache:/cache
    ports:
      - "3010:3010"
    command: ["npm", "run", "dev:web"]

  apkeep:
    build:
      context: .
      dockerfile: docker/apkeep.Dockerfile
    image: chaucer-apkeep
    container_name: chaucer-apkeep
    user: "1000:1000"
    working_dir: /work
    volumes:
      - ./tools/apkeep:/usr/local/bin/apkeep:ro
      - ./apk:/work/apk
    entrypoint: ["apkeep"]
    profiles: ["tools"]

volumes:
  dev-cache:
