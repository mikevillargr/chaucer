[package]
name = "chaucer"
version = "1.2.0"
edition = "2021"

[lib]
name = "chaucer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
encoding_rs = "0.8.42"
futures = "0.3.34"
html-escape = "0.3.0"
keyring = { version = "3", features = ["apple-native", "linux-native"] }
log = "0.4.34"
mail-builder = "2.0.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart", "query", "form", "http2"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
